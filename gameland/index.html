<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی بازی‌ها</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: #faf5ff;
            color: #4a4458;
            min-height: 100vh;
            padding: 20px 12px;
            position: relative;
            overflow-x: hidden;
        }

        .floating-icons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-icon {
            position: absolute;
            animation: floatAround 20s linear infinite;
            opacity: 0.1;
            color: #a855f7;
        }

        @keyframes floatAround {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            25% {
                transform: translate(30px, -40px) rotate(90deg) scale(1.2);
            }
            50% {
                transform: translate(-20px, -80px) rotate(180deg) scale(0.9);
            }
            75% {
                transform: translate(40px, -50px) rotate(270deg) scale(1.1);
            }
            100% {
                transform: translate(0, 0) rotate(360deg) scale(1);
            }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .game-card {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 3px 3px 0 #000000;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
            animation: fadeInUp 0.5s ease backwards;
        }

        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 5px 5px 0 #000000;
        }

        .game-card:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000000;
        }

        .game-image {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-bottom: 2px solid #000000;
            display: block;
        }

        .game-info {
            padding: 10px 12px;
            border-top: 3px solid #a855f7;
        }

        .game-title {
            font-size: 12px;
            font-weight: 700;
            color: #a855f7;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-desc {
            font-size: 9px;
            color: #6b7280;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="floating-icons" id="floatingIcons"></div>

    <div class="container">
        <div class="games-grid" id="gamesGrid"></div>
    </div>

    <script>
        (function() {
            const webApp = window.Eitaa?.WebApp;
            
            if (webApp) {
                webApp.ready();
                webApp.expand();
            }

            const gameIcons = [
                'fa-gamepad', 'fa-dice', 'fa-chess', 'fa-puzzle-piece',
                'fa-trophy', 'fa-star', 'fa-crown', 'fa-ghost',
                'fa-chess-knight', 'fa-chess-queen', 'fa-chess-rook', 'fa-chess-bishop',
                'fa-chess-pawn', 'fa-dice-d6', 'fa-dice-d20', 'fa-dragon',
                'fa-dungeon', 'fa-hat-wizard', 'fa-skull', 'fa-fire',
                'fa-bolt', 'fa-gem', 'fa-coins', 'fa-medal',
                'fa-heart', 'fa-music', 'fa-wand-magic-sparkles', 'fa-shield-halved',
                'fa-sword', 'fa-robot', 'fa-rocket', 'fa-meteor',
                'fa-diamond', 'fa-clover', 'fa-sparkles', 'fa-wand-sparkles'
            ];

            const floatingIcons = document.getElementById('floatingIcons');
            
            let iconsHTML = '';
            gameIcons.forEach((icon, index) => {
                const left = Math.random() * 90;
                const top = Math.random() * 90;
                const size = 20 + Math.random() * 30;
                const delay = Math.random() * 5;
                const duration = 15 + Math.random() * 15;
                
                iconsHTML += `
                    <i class="fa-solid ${icon} floating-icon" 
                       style="left: ${left}%; top: ${top}%; font-size: ${size}px; 
                              animation-delay: ${delay}s; animation-duration: ${duration}s;">
                    </i>
                `;
            });
            
            floatingIcons.innerHTML = iconsHTML;

            const games = [
                {
                    image: 'https://cdn.imgurl.ir/uploads/c5429_InShot_20260819_161157857.jpg',
                    title: 'کوییزیکو',
                    desc: 'بازی کوییز آنلاین با رقابت و امتیاز',
                    color: '#a855f7',
                    link: 'https://eitaa.com/gameland_app/Quizico'
                }
            ];

            const gamesGrid = document.getElementById('gamesGrid');
            
            gamesGrid.innerHTML = games.map((game, index) => {
                return `
                    <div class="game-card" style="animation-delay: ${index * 0.1}s" onclick="openGame(${index})">
                        <img src="${game.image}" class="game-image" alt="${game.title}" style="background: ${game.color};">
                        <div class="game-info" style="border-top-color: ${game.color};">
                            <div class="game-title" style="color: ${game.color};">${game.title}</div>
                            <div class="game-desc">${game.desc}</div>
                        </div>
                    </div>
                `;
            }).join('');

            window.openGame = function(index) {
                if (webApp) {
                    webApp.HapticFeedback?.impactOccurred('light');
                }
                
                const game = games[index];
                
                if (game.link) {
                    if (webApp) {
                        webApp.openEitaaLink(game.link);
                    } else {
                        window.open(game.link, '_blank');
                    }
                }
            };
        })();
    </script>
</body>
</html>
