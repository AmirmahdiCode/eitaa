<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی بازی‌ها</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: #faf5ff;
            color: #4a4458;
            min-height: 100vh;
            padding: 20px 12px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .game-card {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 3px 3px 0 #000000;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
            animation: fadeInUp 0.5s ease backwards;
        }

        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 5px 5px 0 #000000;
        }

        .game-card:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000000;
        }

        .game-image {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-bottom: 2px solid #000000;
            display: block;
        }

        .game-info {
            padding: 10px 12px;
            border-top: 3px solid #a855f7;
        }

        .game-title {
            font-size: 12px;
            font-weight: 700;
            color: #a855f7;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-desc {
            font-size: 9px;
            color: #6b7280;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="games-grid" id="gamesGrid"></div>
    </div>

    <script>
        (function() {
            const webApp = window.Eitaa?.WebApp;
            
            if (webApp) {
                webApp.ready();
                webApp.expand();
            }

            const games = [
                {
                    image: 'https://cdn.imgurl.ir/uploads/r102593_InShot_20260817_115945628.png',
                    title: 'کوییزیکو',
                    desc: 'بازی کوییز آنلاین با رقابت و امتیاز',
                    color: '#a855f7',
                    link: 'https://eitaa.com/gameland_app/Quizico'
                }
            ];

            const gamesGrid = document.getElementById('gamesGrid');
            
            gamesGrid.innerHTML = games.map((game, index) => {
                return `
                    <div class="game-card" style="animation-delay: ${index * 0.1}s" onclick="openGame(${index})">
                        <img src="${game.image}" class="game-image" alt="${game.title}" style="background: ${game.color};">
                        <div class="game-info" style="border-top-color: ${game.color};">
                            <div class="game-title" style="color: ${game.color};">${game.title}</div>
                            <div class="game-desc">${game.desc}</div>
                        </div>
                    </div>
                `;
            }).join('');

            window.openGame = function(index) {
                if (webApp) {
                    webApp.HapticFeedback?.impactOccurred('light');
                }
                
                const game = games[index];
                
                if (game.link) {
                    if (webApp) {
                        webApp.openEitaaLink(game.link);
                    } else {
                        window.open(game.link, '_blank');
                    }
                }
            };
        })();
    </script>
</body>
</html>
